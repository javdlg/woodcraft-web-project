<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Descubre Woodcraft, una tienda exclusiva de productos artesanales en madera de alta calidad.">
    <title>Woodcraft | Tienda de Productos Artesanales</title>
    
    <!-- Conexiones anticipadas para optimizar la carga de fuentes de Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Fuentes: Playfair Display para títulos rústicos/elegantes e Inter para legibilidad del contenido -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Iconos vectoriales premium (FontAwesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Hojas de estilo locales -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <!-- Encabezado y Navegación Principal -->
    <header class="main-header" id="main-header">
        <div class="header-container">
            <!-- Logotipo de Marca -->
            <a href="#" class="logo" id="logo-brand">
                <i class="fa-solid fa-tree logo-icon"></i>
                <span class="logo-text">Wood<span>craft</span></span>
            </a>
            
            <!-- Menú de Navegación Semántico -->
            <nav class="nav-menu" id="nav-menu" aria-label="Navegación principal">
                <ul>
                    <li><a href="#" class="nav-link active" id="nav-link-home">Inicio</a></li>
                    <li><a href="#catalog" class="nav-link" id="nav-link-catalog">Catálogo</a></li>
                    <li><a href="#process" class="nav-link" id="nav-link-process">Nuestro Proceso</a></li>
                    <li><a href="#contact" class="nav-link" id="nav-link-contact">Contacto</a></li>
                </ul>
            </nav>
            
            <!-- Acciones del E-commerce (Carrito e Icono Hamburguesa Móvil) -->
            <div class="header-actions">
                <button class="cart-toggle-btn" id="cart-toggle-btn" aria-label="Abrir carrito de compras">
                    <i class="fa-solid fa-bag-shopping"></i>
                    <span class="cart-badge" id="cart-badge-count">0</span>
                </button>
                <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Abrir menú móvil" aria-expanded="false">
                    <i class="fa-solid fa-bars"></i>
                </button>
            </div>
        </div>
    </header>

    <main>
        <!-- Héroe Principal (Presentación de Marca) -->
        <section class="hero-section" id="hero-section">
            <div class="hero-content">
                <span class="hero-subtitle">Trabajo 100% Artesanal</span>
                <h1 class="hero-title">Madera con Historia para tu Hogar</h1>
                <p class="hero-description">Diseñamos y fabricamos piezas únicas que combinan utilidad, calidez y la belleza natural de la madera noble y sostenible.</p>
                <div class="hero-actions">
                    <a href="#catalog" class="btn btn-primary" id="hero-cta-primary">Ver Catálogo</a>
                    <a href="#process" class="btn btn-secondary" id="hero-cta-secondary">Conocer el Proceso</a>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
